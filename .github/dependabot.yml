version: 2

updates:
  # pnpm workspace: the root entry covers every workspace package, since it is
  # the one that owns pnpm-lock.yaml. Listing `cli` or `packages/*` as well opened
  # a duplicate PR per bump, and that copy left the lockfile untouched.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    # Mirrors the `minimumReleaseAgeStrict` posture in pnpm-workspace.yaml:
    # never propose a release that pnpm would still refuse to install.
    cooldown:
      default-days: 7
    groups:
      dev-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # Sibling packages are released deliberately and in order; bumping them
      # here would race the coordinated release across the anki-md packages.
      - dependency-name: "@shbernal/*"
      - dependency-name: "@ankimd/*"
      # Typed against the engines floor on purpose.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
